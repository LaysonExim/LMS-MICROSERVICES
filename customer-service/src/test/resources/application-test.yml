# Purpose: Test configuration
# File: customer-service/src/test/resources/application-test.yml

spring:
  flyway:
    clean-disabled: false
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.nextgenloan: DEBUG
    org.hibernate: DEBUG
    org.testcontainers: INFO