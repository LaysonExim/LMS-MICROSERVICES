# Purpose: Bootstrap configuration for Loan Service
# File: loan-service/src/main/resources/bootstrap.yml

spring:
  application:
    name: loan-service

  cloud:
    config:
      uri: http://${CONFIG_SERVER_HOST:config-server}:8888
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.2
        max-interval: 5000
      label: main
      profile: default