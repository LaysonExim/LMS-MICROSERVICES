spring:
  application:
    name: monitoring-service
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:config-server}:8888"
  kafka:
    bootstrap-servers: ${KAFKA_HOST:kafka}:9092
    consumer:
      group-id: monitoring-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

server:
  port: 8088

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:discovery-server}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true

logging:
  level:
    com.nextgenloan: DEBUG
    org.springframework.kafka: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  cors:
    allowed-origins: "http://localhost:8080"
    allowed-methods: "*"
    allowed-headers: "*"
