
# Customer Service specific configuration

# This file ONLY applies to customer-service

server:

  port: 8081

spring:

  datasource:

    url: jdbc:sqlserver://${DB_HOST:customer-db}:1433;databaseName=customer_db;encrypt=true;trustServerCertificate=true

    username: sa

    password: ${DB_PASSWORD:Customer@123}

    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    hikari:

      maximum-pool-size: 20

      minimum-idle: 5

      connection-timeout: 30000

      idle-timeout: 600000

      max-lifetime: 1800000

      connection-test-query: SELECT 1

  jpa:

    hibernate:

      ddl-auto: validate

    show-sql: false

    properties:

      hibernate:

        dialect: org.hibernate.dialect.SQLServerDialect

        format_sql: true

        jdbc:

          batch_size: 20

eureka:

  client:

    service-url:

      defaultZone: http://${EUREKA_HOST:discovery-server}:8761/eureka/

    register-with-eureka: true

    fetch-registry: true

  instance:

    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

    prefer-ip-address: true

customer:

  verification:

    enabled: true

    kyc-service-url: https://kyc-service.bank.com

    max-retries: 3

    timeout-seconds: 30

notifications:

  enabled: true

  email:

    welcome-enabled: true

    template: welcome-email.html

